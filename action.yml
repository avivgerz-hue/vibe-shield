name: Vibe-Shield Security Audit
description: Statically scan a repository and its agent configurations for security risks.
author: VibeFoundry
branding:
  icon: shield
  color: purple
inputs:
  target:
    description: Project directory or file to scan.
    default: '.'
  fail-on:
    description: Minimum severity that fails the action (critical, high, medium, low, info).
    default: high
  audit-skills:
    description: Also audit agent instructions and MCP configuration (true or false).
    default: 'true'
  sarif-file:
    description: Optional path for the scan SARIF report; upload it separately if desired.
    default: ''
runs:
  using: composite
  steps:
    - name: Scan project
      id: scan
      shell: bash
      continue-on-error: true
      env:
        VIBE_TARGET: ${{ inputs.target }}
        VIBE_FAIL_ON: ${{ inputs.fail-on }}
        VIBE_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        if [[ -n "$VIBE_SARIF_FILE" ]]; then
          npx -y @vibefoundry/vibe-shield@2.0.0 scan "$VIBE_TARGET" --fail-on "$VIBE_FAIL_ON" --format sarif --out "$VIBE_SARIF_FILE"
        else
          npx -y @vibefoundry/vibe-shield@2.0.0 scan "$VIBE_TARGET" --fail-on "$VIBE_FAIL_ON"
        fi
    - name: Audit agent configurations
      id: audit
      if: ${{ inputs.audit-skills == 'true' }}
      shell: bash
      continue-on-error: true
      env:
        VIBE_TARGET: ${{ inputs.target }}
        VIBE_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        npx -y @vibefoundry/vibe-shield@2.0.0 audit-skills "$VIBE_TARGET" --fail-on "$VIBE_FAIL_ON"
    - name: Enforce security gate
      if: ${{ always() }}
      shell: bash
      env:
        VIBE_SCAN_OUTCOME: ${{ steps.scan.outcome }}
        VIBE_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        VIBE_AUDIT_ENABLED: ${{ inputs.audit-skills }}
      run: |
        set -euo pipefail
        if [[ "$VIBE_AUDIT_ENABLED" != 'true' && "$VIBE_AUDIT_ENABLED" != 'false' ]]; then
          echo 'audit-skills must be true or false' >&2
          exit 2
        fi
        if [[ "$VIBE_SCAN_OUTCOME" != 'success' ]] || [[ "$VIBE_AUDIT_ENABLED" == 'true' && "$VIBE_AUDIT_OUTCOME" != 'success' ]]; then
          echo 'Vibe-Shield security gate failed.' >&2
          exit 1
        fi
