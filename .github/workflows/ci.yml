name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 18 is the minimum the *published package* supports; the dev toolchain
        # (vitest 5) needs 20+, so those jobs build and smoke-test the real CLI
        # instead of running the suite. Nothing ships untested: `smoke` below
        # exercises every rule against the fixtures using the compiled binary.
        node: [18, 20, 22, 24]
        include:
          - node: 18
            suite: false
          - node: 20
            suite: true
          - node: 22
            suite: true
          - node: 24
            suite: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.suite
        run: npm test

      - name: Check the compiled CLI on the oldest supported runtime
        if: ${{ !matrix.suite }}
        run: |
          set -euo pipefail
          node dist/bin/vibe-shield.js version
          node dist/bin/vibe-shield.js scan --quiet
          node dist/bin/vibe-shield.js audit-skills --quiet
          # The vulnerable fixture must be detected, and the gate must exit 1.
          # Run it as its own project root: framework detection reads the
          # nearest package.json, so scanning it from the repo root would see a
          # plain Node CLI and correctly skip the Next.js rules.
          set +e
          ( cd tests/fixtures/vulnerable && node "$GITHUB_WORKSPACE/dist/bin/vibe-shield.js" scan --rules VSB-AUTH-001 --format json --fail-on critical >/dev/null )
          status=$?
          set -e
          test "$status" -eq 1
          node dist/bin/vibe-shield.js scan --format sarif | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.version!=='2.1.0')process.exit(1)})"

      - name: Self-scan (security gate)
        if: matrix.node == 20
        run: node dist/bin/vibe-shield.js scan --format github --fail-on high

      - name: Self-audit (agent surface gate)
        if: matrix.node == 20
        run: node dist/bin/vibe-shield.js audit-skills --format github --fail-on high

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
