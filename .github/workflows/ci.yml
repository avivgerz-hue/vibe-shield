name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 18 is the minimum the *published package* supports; the dev toolchain
        # (vitest 5) needs 20+, so those jobs build and smoke-test the real CLI
        # instead of running the suite. Nothing ships untested: `smoke` below
        # exercises every rule against the fixtures using the compiled binary.
        node: [18, 20, 22, 24]
        include:
          - node: 18
            suite: false
          - node: 20
            suite: true
          - node: 22
            suite: true
          - node: 24
            suite: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.suite
        run: npm test

      - name: Check the compiled CLI on the oldest supported runtime
        if: ${{ !matrix.suite }}
        run: |
          set -euo pipefail
          node dist/bin/vibe-shield.js version
          node dist/bin/vibe-shield.js scan --quiet
          node dist/bin/vibe-shield.js audit-skills --quiet
          # The vulnerable fixture must be detected, and the gate must exit 1.
          # Run it as its own project root: framework detection reads the
          # nearest package.json, so scanning it from the repo root would see a
          # plain Node CLI and correctly skip the Next.js rules.
          set +e
          ( cd tests/fixtures/vulnerable && node "$GITHUB_WORKSPACE/dist/bin/vibe-shield.js" scan --rules VSB-AUTH-001 --format json --fail-on critical >/dev/null )
          status=$?
          set -e
          test "$status" -eq 1
          node dist/bin/vibe-shield.js scan --format sarif | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.version!=='2.1.0')process.exit(1)})"

      - name: Self-scan (security gate)
        if: matrix.node == 20
        run: node dist/bin/vibe-shield.js scan --format github --fail-on high

      - name: Self-audit (agent surface gate)
        if: matrix.node == 20
        run: node dist/bin/vibe-shield.js audit-skills --format github --fail-on high

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  docker-mcp:
    name: Docker MCP handshake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # The image copies the committed `dist/` rather than compiling, so a stale
      # build would ship stale code inside a green pipeline.
      - name: Committed dist/ matches the source
        run: git diff --exit-code -- dist

      - name: Build the image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VIBE_SHIELD_REV=${{ github.sha }}" \
            --tag vibe-shield:mcp .

      - name: Prepare the handshake requests
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/requests.jsonl" <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          JSON

      # `-i` keeps stdin attached — stdio transport is the whole point.
      # `--read-only` proves the server never writes to its own filesystem.
      - name: Drive initialize + tools/list over stdio
        run: |
          set -euo pipefail
          docker run --rm -i --read-only --tmpfs /tmp vibe-shield:mcp \
            < "$RUNNER_TEMP/requests.jsonl" > "$RUNNER_TEMP/responses.jsonl" 2> "$RUNNER_TEMP/stderr.txt"

          echo "--- container stderr ---"
          cat "$RUNNER_TEMP/stderr.txt"
          echo "--- container stdout ---"
          cat "$RUNNER_TEMP/responses.jsonl"

          node - "$RUNNER_TEMP/responses.jsonl" <<'NODE'
          const fs = require('node:fs');
          const frames = fs.readFileSync(process.argv[2], 'utf8')
            .split('\n')
            .filter((line) => line.trim())
            .map((line, index) => {
              try {
                return JSON.parse(line);
              } catch {
                // A stray log line here corrupts a real client session.
                throw new Error(`stdout line ${index + 1} is not JSON: ${line.slice(0, 80)}`);
              }
            });

          if (frames.length < 2) throw new Error(`expected 2 JSON-RPC frames, got ${frames.length}`);

          const init = frames.find((frame) => frame.id === 1);
          if (!init) throw new Error('no response to initialize');
          if (init.error) throw new Error(`initialize returned an error: ${JSON.stringify(init.error)}`);

          const info = init.result.serverInfo;
          if (!info || !info.name) throw new Error('serverInfo.name missing');
          if (!/^\d+\.\d+\.\d+/.test(info.version)) {
            throw new Error(`serverInfo.version is not semver: ${JSON.stringify(info.version)}`);
          }

          const list = frames.find((frame) => frame.id === 2);
          if (!list) throw new Error('no response to tools/list');
          if (list.error) throw new Error(`tools/list returned an error: ${JSON.stringify(list.error)}`);

          const tools = list.result.tools;
          if (!Array.isArray(tools) || tools.length !== 3) {
            throw new Error(`expected 3 tools, got ${Array.isArray(tools) ? tools.length : typeof tools}`);
          }
          for (const tool of tools) {
            if (!tool.name || !tool.inputSchema || tool.inputSchema.type !== 'object') {
              throw new Error(`tool malformed: ${JSON.stringify(tool).slice(0, 120)}`);
            }
          }

          console.log(`\nOK: ${info.name} v${info.version} exposed ${tools.length} tools over stdio`);
          NODE

      - name: Report the image size
        run: |
          docker image inspect vibe-shield:mcp --format '{{.Size}}' \
            | awk '{printf "image size: %.1f MB\n", $1/1024/1024}'

  mcp-registry:
    name: Official MCP Registry validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate server.json with mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate server.json

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
