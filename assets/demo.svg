<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Vibe-Shield security scan terminal demo</title>
  <desc id="desc">Illustrative two-file scan: an unguarded DELETE route and a table without row-level security receive grade F, 29 out of 100. After a developer manually adds session authorization and enables RLS, a new scan reports grade A plus, 100 out of 100. Results vary; a clean score is not a security guarantee.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b2c"/><stop offset="1" stop-color="#080d18"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b4b82"/><stop offset=".55" stop-color="#263049"/><stop offset="1" stop-color="#253a45"/></linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .s1 { animation: stage1 13s infinite; }
      .s2 { animation: stage2 13s infinite; }
      .s3 { animation: stage3 13s infinite; }
      .s4 { animation: stage4 13s infinite; }
      .s5 { animation: stage5 13s infinite; }
      .s6 { animation: stage6 13s infinite; }
      @keyframes stage1 { 0%, 6% { opacity: 0 } 8%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
      @keyframes stage2 { 0%, 14% { opacity: 0 } 16%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
      @keyframes stage3 { 0%, 24% { opacity: 0 } 26%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
      @keyframes stage4 { 0%, 34% { opacity: 0 } 36%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
      @keyframes stage5 { 0%, 45% { opacity: 0 } 47%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
      @keyframes stage6 { 0%, 56% { opacity: 0 } 58%, 94% { opacity: 1 } 99%, 100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .s1,.s2,.s3,.s4,.s5,.s6 { animation: none; opacity: 1 } }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="498" rx="15" fill="url(#background)" stroke="url(#border)" stroke-width="2"/>
  <path d="M16 1h868a15 15 0 0 1 15 15v38H1V16A15 15 0 0 1 16 1z" fill="#1b2030"/>
  <path d="M1 54h898" stroke="#313a50"/>
  <circle cx="29" cy="28" r="6" fill="#ff6b78"/><circle cx="50" cy="28" r="6" fill="#f9c765"/><circle cx="71" cy="28" r="6" fill="#6ed7a5"/>
  <text class="mono" x="99" y="33" fill="#a8b4ca" font-size="13">~/my-app  —  vibe-shield</text>
  <rect x="755" y="16" width="116" height="23" rx="5" fill="#292740" stroke="#48415f"/>
  <text class="mono" x="813" y="32" text-anchor="middle" fill="#c4b1f6" font-size="10" font-weight="700" letter-spacing="1">EXAMPLE SCAN</text>

  <g class="mono" font-size="15">
    <text x="30" y="91" fill="#91e4ba" font-weight="700">$</text>
    <text x="50" y="91" fill="#eef2fb">npx -y @vibefoundry/vibe-shield@latest scan .</text>
    <g class="s1">
      <text x="30" y="124" fill="#a6b5ca">vibe-shield  ·  security scan</text>
      <rect x="30" y="142" width="840" height="56" rx="7" fill="#2b1d2a" stroke="#6e3445"/>
      <text x="48" y="176" fill="#ff9ca8" font-size="18" font-weight="700">GRADE F  —  29/100</text>
      <text x="844" y="175" text-anchor="end" fill="#ffb0ba" font-size="13" font-weight="700">2 CRITICAL  ·  0.034s</text>
    </g>
    <g class="s2">
      <text x="31" y="231" fill="#f98f9f" font-size="12" font-weight="700">CRITICAL</text>
      <text x="126" y="231" fill="#f1f2f7" font-weight="700">VSB-AUTH-001</text>
      <text x="276" y="231" fill="#c3cede">Mutation route has no session check</text>
      <text x="126" y="251" fill="#8591a9" font-size="12">app/api/users/route.ts:1</text>
    </g>
    <g class="s3">
      <text x="31" y="281" fill="#f98f9f" font-size="12" font-weight="700">CRITICAL</text>
      <text x="126" y="281" fill="#f1f2f7" font-weight="700">VSB-DB-001</text>
      <text x="276" y="281" fill="#c3cede">Table has no observed RLS enablement</text>
      <text x="126" y="301" fill="#8591a9" font-size="12">supabase/migrations/001_init.sql:1</text>
    </g>
    <g class="s4">
      <path d="M30 326h840" stroke="#2b3449"/>
      <text x="30" y="354" fill="#a5b0c2" font-size="13"># Manually add session ownership + enable RLS</text>
    </g>
    <g class="s5">
      <text x="30" y="386" fill="#91e4ba" font-weight="700">$</text>
      <text x="50" y="386" fill="#eef2fb">npx -y @vibefoundry/vibe-shield@latest scan .</text>
    </g>
    <g class="s6">
      <rect x="30" y="403" width="840" height="55" rx="7" fill="#142d2b" stroke="#286251"/>
      <text x="48" y="437" fill="#8be9bc" font-size="18" font-weight="700">GRADE A+  —  100/100</text>
      <text x="844" y="436" text-anchor="end" fill="#a4e8c6" font-size="13" font-weight="700">0 FINDINGS  ·  0.032s</text>
    </g>
  </g>
  <text class="mono" x="31" y="481" fill="#748299" font-size="11">2-file example  ·  sample timings  ·  abbreviated output  ·  results vary</text>
</svg>
